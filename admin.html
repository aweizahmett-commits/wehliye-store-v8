<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEHLIYE • Owner Dashboard</title><style>
:root{font:15px system-ui,Arial;color:#18332f;background:#f4f5f1}*{box-sizing:border-box}body{margin:0}header{background:#102c2a;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}header b{font:700 23px Georgia;letter-spacing:2px}a{color:inherit}main{max-width:1180px;margin:36px auto;padding:0 20px}h1{font:500 37px Georgia}button{cursor:pointer;background:#102c2a;color:#fff;border:0;padding:12px 18px;border-radius:5px}button:hover{background:#20544a}.danger{background:#9a3e35}.muted{color:#65736c}input,select,textarea{width:100%;border:1px solid #cfd7d1;padding:12px;border-radius:5px;background:#fff;font:inherit}label{display:block;font-weight:600;font-size:13px;margin:13px 0}label input,label select,label textarea{margin-top:6px}.panel{background:#fff;padding:25px;border:1px solid #e1e7e2;border-radius:12px;margin:20px 0;box-shadow:0 8px 35px #173e2810}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#e0e8e1;color:#18332f}.tabs button.active{background:#102c2a;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;align-items:center;gap:15px;padding:12px 0;border-bottom:1px solid #eee}.row img{width:64px;height:75px;object-fit:cover;border-radius:4px}.row .grow{flex:1}.row small{display:block;color:#777}.row button{padding:9px 12px}.preview{max-width:120px;max-height:120px;object-fit:cover}#message{color:#167348;min-height:20px}#login{max-width:450px;margin:80px auto}#dashboard{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{flex-wrap:wrap}header b{font-size:17px}}
</style><header><b>W ✦ WEHLIYE STORE</b><span><a href="/">← Customer website</a></span></header>
<section id="login" class="panel"><h1>Owner sign in</h1><p class="muted">Private store management. Your changes appear on the customer website.</p><form id="loginForm"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in to admin</button></form><p id="loginError" style="color:#a33"></p></section>
<main id="dashboard"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px"><div><h1>Store management</h1><p class="muted">Products, inventory, photos and storefront text — published for all visitors.</p></div><button id="logout">Sign out</button></div><div class="tabs"><button data-tab="products" class="active">Products & Stock</button><button data-tab="content">Website Content</button></div><p id="message"></p>
<section id="productsPanel"><div class="panel"><h2 id="formTitle">Add new product</h2><form id="productForm"><div class="grid"><label>Product name<input id="pname" required maxlength="149"></label><label>Category<select id="pcategory"><option>Suits</option><option>Blazers</option><option>Shirts</option><option>Shoes</option><option>Trousers</option><option>Accessories</option><option>Casual</option></select></label><label>Price (USD)<input id="pprice" type="number" min="0.01" step="0.01" required></label><label>Quantity in stock<input id="pstock" type="number" min="0" step="1" required></label><label>Sizes (comma-separated)<input id="psizes" value="S,M,L,XL"></label><label>Colors (comma-separated)<input id="pcolors" value="Black,Navy"></label></div><label>Description<textarea id="pdescription" rows="3"></textarea></label><label>Image URL (or upload below)<input id="pimage" placeholder="https://..."></label><label>Upload photo (max ~2MB)<input id="pfile" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="preview" class="preview" hidden><p><button type="submit">Save & publish product</button> <button type="button" id="cancelEdit">Clear form</button></p></form></div><div class="panel"><h2>Inventory <span id="count"></span></h2><div id="productList"></div></div></section>
<section id="contentPanel" hidden><div class="panel"><h2>Edit customer-facing website text</h2><form id="contentForm"><div class="grid" id="contentFields"></div><button>Save & publish text</button></form></div></section></main>
<script>
let token=sessionStorage.getItem('wehliye_owner_token')||'',store={products:[],content:{}},editing=null;
const $=id=>document.getElementById(id);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,method='GET',data){const r=await fetch(url,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:data===undefined?undefined:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function note(s){$('message').textContent=s;setTimeout(()=>$('message').textContent='',5000)}
async function refresh(){store=await api('/api/store');render()}
function render(){const a=$('productList');$('count').textContent=`(${store.products.length})`;a.innerHTML=store.products.map(p=>`<div class="row"><img src="${escapeHTML(p.image)}" alt=""><div class="grow"><b>${escapeHTML(p.name)}</b><small>${escapeHTML(p.category)} · $${Number(p.price).toFixed(2)} · Stock: ${p.stock}</small></div><button data-edit="${p.id}">Edit</button><button class="danger" data-delete="${p.id}">Delete</button></div>`).join('');$('contentFields').innerHTML=Object.entries(store.content).map(([k,v])=>`<label>${escapeHTML(k.toUpperCase())}<input data-key="${escapeHTML(k)}" value="${escapeHTML(v)}"></label>`).join('')}
function clear(){editing=null;$('productForm').reset();$('formTitle').textContent='Add new product';$('preview').hidden=true}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const j=await api('/api/admin/login','POST',{username:$('username').value,password:$('password').value});token=j.token;sessionStorage.setItem('wehliye_owner_token',token);$('login').hidden=true;$('dashboard').style.display='block';await refresh()}catch(e){$('loginError').textContent=e.message}};
$('logout').onclick=async()=>{try{await api('/api/admin/logout','POST',{})}catch{}sessionStorage.removeItem('wehliye_owner_token');location.reload()};
$('productList').onclick=async e=>{const id=Number(e.target.dataset.edit||e.target.dataset.delete);if(!id)return;const p=store.products.find(x=>x.id===id);if(e.target.dataset.delete){if(!confirm(`Delete ${p.name} from customer website?`))return;try{await api('/api/admin/products/'+id,'DELETE');await refresh();note('Product removed from the store')}catch(err){alert(err.message)}return}editing=id;$('formTitle').textContent='Edit product';for(const [key,value] of Object.entries({pname:p.name,pcategory:p.category,pprice:p.price,pstock:p.stock,pdescription:p.description,pimage:p.image,psizes:p.sizes.join(','),pcolors:p.colors.join(',')}))$(key).value=value;$('preview').src=p.image;$('preview').hidden=false;window.scrollTo({top:0,behavior:'smooth'})};
$('cancelEdit').onclick=clear;
$('pfile').onchange=()=>{const f=$('pfile').files[0];if(!f)return;if(f.size>2_000_000){alert('Use an image under 2MB');return}const r=new FileReader();r.onload=()=>{$('pimage').value=r.result;$('preview').src=r.result;$('preview').hidden=false};r.readAsDataURL(f)};
$('productForm').onsubmit=async e=>{e.preventDefault();const p={name:$('pname').value.trim(),category:$('pcategory').value,price:Number($('pprice').value),stock:Number($('pstock').value),description:$('pdescription').value,image:$('pimage').value,sizes:$('psizes').value.split(',').map(x=>x.trim()).filter(Boolean),colors:$('pcolors').value.split(',').map(x=>x.trim()).filter(Boolean)};if(!p.image)return alert('Upload a photo or enter image URL');try{await api(editing?'/api/admin/products/'+editing:'/api/admin/products',editing?'PUT':'POST',p);clear();await refresh();note('Product published to customer website')}catch(err){alert(err.message)}};
$('contentForm').onsubmit=async e=>{e.preventDefault();const c={};document.querySelectorAll('[data-key]').forEach(el=>c[el.dataset.key]=el.value);try{await api('/api/admin/content','PUT',c);await refresh();note('Website text published')}catch(err){alert(err.message)}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('productsPanel').hidden=b.dataset.tab!=='products';$('contentPanel').hidden=b.dataset.tab!=='content'});
if(token){$('login').hidden=true;$('dashboard').style.display='block';refresh().catch(()=>{sessionStorage.removeItem('wehliye_owner_token');location.reload()})}
</script></html>
